networks:
  liga-network:
    driver: bridge

volumes:
  postgres-data:

services:
  db-liga:
    image: postgres:16-alpine
    container_name: postgres-docker-liga
    environment:
      - POSTGRES_DB=ligadb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - liga-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: appbyteredis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - liga-network
    restart: unless-stopped

  api:
    image: ghcr.io/arthurdmc2005/bytebuilders:latest
    container_name: liga-api
    ports:
      - "80:8080"
    env_file: .env
    environment:
      - DB_URL=jdbc:postgresql://db-liga:5432/ligadb
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m
    depends_on:
      - db-liga
      - redis
    networks:
      - liga-network
    restart: unless-stopped
networks:
  liga-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  db-liga:
    image: postgres:16-alpine
    container_name: postgres-docker-liga
    environment:
      - POSTGRES_DB=ligadb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - liga-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: appbyteredis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - liga-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - liga-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - liga-network
    restart: unless-stopped

  api:
    image: ghcr.io/bytebuildersufvjm2026/workspace-service:latest
    container_name: liga-api
    env_file: .env
    environment:
      - DB_URL=jdbc:postgresql://db-liga:5432/ligadb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db-liga
      - redis
      - minio
    networks:
      - liga-network
    restart: unless-stopped

version: '3.8'

# Ambiente de produção (VPS).
# Postgres e Redis NÃO expõem portas ao host — acessíveis apenas
# pela rede interna `liga-network` via nome de serviço (DNS do Docker).
# A API escuta na porta 80 do host e encaminha para 8080 internamente.

networks:
  liga-network:
    driver: bridge

volumes:
  postgres-data:

services:
  db-liga:
    image: postgres:16-alpine
    container_name: postgres-docker-liga
    environment:
      - POSTGRES_DB=ligadb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - liga-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: appbyteredis
    networks:
      - liga-network
    restart: unless-stopped

  api:
    build: .
    container_name: liga-api
    ports:
      - "80:8080"
    env_file: .env
    environment:
      # Sobrescreve os valores do .env com os hostnames internos do Docker.
      # A API não usa "localhost" — ela usa o nome do serviço como hostname.
      - DB_URL=jdbc:postgresql://db-liga:5432/ligadb
      - REDIS_HOST=redis
    depends_on:
      - db-liga
      - redis
    networks:
      - liga-network
    restart: unless-stopped
spring.flyway.placeholders.db_name=ligadb
spring.flyway.placeholders.admin_role=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${USER_APP}
spring.datasource.password=${PASSWORD_APP}

# Flyway usa o usuário admin (postgres) para executar as migrations com DDL completo
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

api.security.token.secret=${JWT_SECRET}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.jpa.hibernate.ddl-auto=validate

# Permite que o Flyway ignore divergências de checksum em migrations já aplicadas.
# Necessário porque V7 foi editado após já ter sido aplicado no banco local.
# NUNCA adicionar em application-prod.properties.
spring.flyway.validate-on-migrate=false

cors.allowed-origins=http://localhost:5173

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:senha_segura_123}
minio.bucket=${MINIO_BUCKET:academic-project-files}
minio.max-file-size=25MB
minio.create-bucket-on-startup=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

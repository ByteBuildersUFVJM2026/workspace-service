spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true

# Flyway placeholders — resolvidos a partir das variáveis de ambiente pelo Spring antes de repassar ao Flyway
spring.flyway.placeholders.app_user=${USER_APP}
spring.flyway.placeholders.app_password=${PASSWORD_APP}

spring.profiles.active=dev




spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
spring.profiles.default=dev

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate

    spring.flyway.baseline-on-migrate=true

# Flyway placeholders \u00E2\u0080\u0094 resolvidos a partir das vari\u00C3\u00A1veis de ambiente pelo Spring antes de repassar ao Flyway
spring.flyway.placeholders.app_user=${USER_APP}
spring.flyway.placeholders.app_password=${PASSWORD_APP}

api.security.token.issuer=${JWT_ISSUER:academic-project-api}
api.security.token.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
api.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
